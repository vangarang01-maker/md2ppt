{% extends "_base.html" %}
{% block content %}
<!-- 제목 영역 -->
<div style="position:absolute;top:0;left:0;right:0;padding:52px 80px 0;">
  <h2 style="font-size:34px;font-weight:700;color:{{ theme.text }};letter-spacing:-0.3px;">{{ slide.title }}</h2>
  <div style="margin-top:10px;width:48px;height:4px;background:{{ theme.accent }};border-radius:2px;"></div>
</div>

<!-- 스탯 카드 -->
{% set stats = slide.stats[:3] %}
{% set count = stats | length %}
{% set card_width = (1120 / count) - 20 %}
<div style="position:absolute;top:160px;left:80px;right:80px;bottom:60px;display:flex;align-items:center;justify-content:center;gap:24px;">
  {% for stat in stats %}
  <div style="flex:1;height:360px;background:{{ theme.surface }};border-radius:16px;border:1px solid {{ theme.accent }}30;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;">
    <!-- 상단 액센트 스트라이프 -->
    <div style="position:absolute;top:0;left:0;right:0;height:5px;background:{{ theme.accent }};"></div>
    <!-- 배경 원 장식 -->
    <div style="position:absolute;bottom:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:{{ theme.accent }}0a;pointer-events:none;"></div>
    <!-- 수치 -->
    <div style="font-size:72px;font-weight:900;color:{{ theme.accent }};line-height:1;letter-spacing:-2px;">{{ stat.value }}</div>
    <!-- 레이블 -->
    <div style="margin-top:16px;font-size:16px;font-weight:500;color:{{ theme.subtext }};letter-spacing:0.5px;text-align:center;padding:0 24px;">{{ stat.label }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
