{% extends "_base.html" %}
{% block content %}
<!-- 배경 장식 -->
<div style="position:absolute;right:-100px;bottom:-100px;width:400px;height:400px;border-radius:50%;background:{{ theme.accent }}08;pointer-events:none;"></div>

<!-- 제목 영역 -->
<div style="position:absolute;top:0;left:0;right:0;padding:52px 80px 0;">
  <div style="display:flex;align-items:center;gap:16px;">
    {% if slide.icon and icons.get(slide.icon) %}
    <div style="color:{{ theme.accent }};width:40px;height:40px;flex-shrink:0;">{{ icons.get(slide.icon) | safe }}</div>
    {% endif %}
    <h2 style="font-size:36px;font-weight:700;color:{{ theme.text }};letter-spacing:-0.3px;line-height:1.3;">{{ slide.title }}</h2>
  </div>
  <div style="margin-top:12px;width:52px;height:4px;background:{{ theme.accent }};border-radius:2px;"></div>
</div>

<!-- 불릿 목록 -->
<div style="position:absolute;top:168px;left:80px;right:80px;bottom:60px;display:flex;flex-direction:column;justify-content:center;gap:0;">
  {% for bullet in slide.bullets %}
  <div style="display:flex;align-items:flex-start;gap:20px;padding:18px 0;border-bottom:1px solid {{ theme.surface }}aa;">
    <div style="margin-top:3px;width:8px;height:8px;min-width:8px;border-radius:50%;background:{{ theme.accent }};margin-top:8px;"></div>
    <p style="font-size:22px;font-weight:400;color:{{ theme.body }};line-height:1.55;">{{ bullet }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
