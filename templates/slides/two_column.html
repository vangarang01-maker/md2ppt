{% extends "_base.html" %}
{% block content %}
<!-- 제목 영역 -->
<div style="position:absolute;top:0;left:0;right:0;padding:52px 80px 0;">
  <h2 style="font-size:34px;font-weight:700;color:{{ theme.text }};letter-spacing:-0.3px;">{{ slide.title }}</h2>
  <div style="margin-top:10px;width:48px;height:4px;background:{{ theme.accent }};border-radius:2px;"></div>
</div>

<!-- 두 컬럼 패널 -->
<div style="position:absolute;top:150px;left:60px;right:60px;bottom:48px;display:flex;gap:20px;">
  {% for panel, bg_opacity in [(slide.left, '18'), (slide.right, '10')] %}
  <div style="flex:1;background:{{ theme.surface }};border-radius:14px;border:1px solid {{ theme.accent }}{{ bg_opacity }};padding:32px 36px;overflow:hidden;position:relative;">
    <!-- 상단 컬러 라인 -->
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:{{ theme.accent }};"></div>
    {% if panel.heading %}
    <div style="font-size:18px;font-weight:700;color:{{ theme.accent }};letter-spacing:0.3px;margin-bottom:20px;padding-top:8px;">{{ panel.heading }}</div>
    {% endif %}
    <div style="display:flex;flex-direction:column;gap:14px;">
      {% for bullet in panel.bullets %}
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <div style="min-width:6px;height:6px;border-radius:50%;background:{{ theme.accent }};margin-top:9px;"></div>
        <span style="font-size:18px;color:{{ theme.body }};line-height:1.55;">{{ bullet }}</span>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
