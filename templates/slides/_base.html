<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.slide {
  width: 1280px;
  height: 720px;
  background: {{ theme.bg }};
  color: {{ theme.text }};
  position: relative;
  overflow: hidden;
}
</style>
</head>
<body>
<div class="slide">
{% block content %}{% endblock %}
</div>
</body>
</html>
