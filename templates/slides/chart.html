{% extends "_base.html" %}
{% block content %}
<script>{{ chartjs | safe }}</script>

<!-- 배경 장식 -->
<div style="position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:{{ theme.accent }}06;pointer-events:none;"></div>

<!-- 제목 영역 -->
<div style="position:absolute;top:0;left:0;right:0;padding:36px 72px 0;">
  <h2 style="font-size:30px;font-weight:800;color:{{ theme.text }};letter-spacing:-0.5px;">{{ slide.title }}</h2>
  <div style="margin-top:8px;width:44px;height:4px;background:{{ theme.accent }};border-radius:2px;"></div>
</div>

<!-- 차트 영역 -->
<div style="position:absolute;top:100px;left:52px;right:52px;bottom:32px;background:{{ theme.surface }};border-radius:16px;border:1px solid {{ theme.accent }}18;padding:24px 28px;">
  <canvas id="chart" style="width:100%;height:100%;"></canvas>
</div>

<script>
(function() {
  const ctx = document.getElementById('chart').getContext('2d');
  const chartTypeMap = { bar: 'bar', column: 'bar', line: 'line', pie: 'doughnut' };
  const type = chartTypeMap['{{ slide.chart_type }}'] || 'bar';
  const isHorizontal = '{{ slide.chart_type }}' === 'bar';
  const isPie = type === 'doughnut';

  const accent = '{{ theme.accent }}';
  const alphas = ['ff','cc','99','66','44','33'];
  const palette = alphas.map(a => accent + a);

  const datasets = [
    {% for s in slide.series %}
    {
      label: '{{ s.name }}',
      data: {{ s['values'] | tojson }},
      backgroundColor: isPie
        ? {{ s['values'] | tojson }}.map((_, i) => palette[i % palette.length])
        : palette[{{ loop.index0 }} % palette.length],
      borderColor: isPie ? 'transparent' : accent,
      borderWidth: isPie ? 0 : 0,
      borderRadius: (!isPie && type === 'bar') ? 5 : 0,
      tension: 0.4,
      fill: type === 'line' ? { target: 'origin', above: accent + '18' } : false,
      pointBackgroundColor: accent,
      pointRadius: type === 'line' ? 4 : 0,
    },
    {% endfor %}
  ];

  new Chart(ctx, {
    type: type,
    data: {
      labels: {{ slide.categories | tojson }},
      datasets: datasets,
    },
    options: {
      indexAxis: isHorizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: {
          display: isPie || datasets.length > 1,
          position: isPie ? 'right' : 'top',
          labels: {
            color: '{{ theme.subtext }}',
            font: { size: 13, family: 'Noto Sans KR, sans-serif' },
            boxWidth: 12, padding: 16,
          }
        },
        tooltip: {
          backgroundColor: '{{ theme.surface }}',
          borderColor: accent + '44',
          borderWidth: 1,
          titleColor: '{{ theme.text }}',
          bodyColor: '{{ theme.body }}',
          padding: 10,
        }
      },
      scales: isPie ? {} : {
        x: {
          indexAxis: isHorizontal ? 'y' : 'x',
          ticks: {
            color: '{{ theme.subtext }}',
            font: { size: 12, family: 'Noto Sans KR, sans-serif' },
          },
          grid: { color: accent + '14' },
          border: { color: accent + '30' },
        },
        y: {
          ticks: {
            color: '{{ theme.subtext }}',
            font: { size: 12, family: 'Noto Sans KR, sans-serif' },
          },
          grid: { color: accent + '14' },
          border: { color: accent + '30' },
        },
      }
    }
  });
})();
</script>
{% endblock %}
