{% extends "_base.html" %}
{% block content %}
<!-- 배경 이미지 -->
{% if image_url %}
<div style="position:absolute;inset:0;background:url('{{ image_url }}') center/cover;"></div>
<div style="position:absolute;inset:0;background:linear-gradient(135deg, {{ theme.bg }}f0 0%, {{ theme.bg }}d8 100%);"></div>
{% endif %}

<!-- 상단/하단 액센트 라인 -->
<div style="position:absolute;top:0;left:0;right:0;height:5px;background:{{ theme.accent }};"></div>
<div style="position:absolute;bottom:0;left:0;right:0;height:5px;background:{{ theme.accent }};"></div>

<!-- 배경 장식 원 -->
<div style="position:absolute;left:-60px;bottom:-60px;width:320px;height:320px;border-radius:50%;background:{{ theme.accent }}0e;pointer-events:none;"></div>

<!-- 큰 따옴표 장식 -->
<div style="position:absolute;top:44px;left:68px;font-size:140px;font-weight:900;color:{{ theme.accent }};line-height:1;opacity:0.7;font-family:Georgia,serif;pointer-events:none;">&#8220;</div>

<!-- 인용문 콘텐츠 -->
<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:110px 120px 90px;">
  <blockquote style="font-size:30px;font-weight:500;color:{{ theme.text }};line-height:1.65;letter-spacing:-0.3px;">{{ slide.quote }}</blockquote>
  {% if slide.attribution %}
  <div style="margin-top:36px;display:flex;align-items:center;gap:18px;">
    <div style="width:40px;height:2px;background:{{ theme.accent }};border-radius:2px;"></div>
    <span style="font-size:16px;color:{{ theme.subtext }};font-weight:600;letter-spacing:0.8px;text-transform:uppercase;">{{ slide.attribution }}</span>
  </div>
  {% endif %}
</div>
{% endblock %}
